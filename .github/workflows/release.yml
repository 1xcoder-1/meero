name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Test & typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install deps
        run: bun install

      - name: Unit tests
        run: bun test

      - name: Typecheck
        run: bunx tsc --noEmit

  build:
    name: Build binaries
    needs: test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target:
          - bun-darwin-arm64
          - bun-darwin-x64
          - bun-linux-x64
          - bun-linux-arm64
          - bun-windows-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install deps
        run: bun install

      - name: Build
        run: |
          TARGET=${{ matrix.target }}

          if [[ "$TARGET" == "bun-darwin-arm64" ]]; then
            OUT="meero-macos-arm64"
          elif [[ "$TARGET" == "bun-darwin-x64" ]]; then
            OUT="meero-macos-x64"
          elif [[ "$TARGET" == "bun-linux-x64" ]]; then
            OUT="meero-linux-x64"
          elif [[ "$TARGET" == "bun-linux-arm64" ]]; then
            OUT="meero-linux-arm64"
          elif [[ "$TARGET" == "bun-windows-x64" ]]; then
            OUT="meero-windows-x64.exe"
          fi

          bun build ./index.ts --compile --minify --target=$TARGET --outfile=$OUT

          # Compressed release assets: a bun-compiled binary embeds the whole
          # runtime (~110 MB raw); gzip/zip cuts the download to roughly 40%.
          # The Windows exe stays RAW here — the brand-windows job patches its
          # icon and re-zips it, so nobody downloads a Bun-logo exe twice.
          if [[ "$TARGET" == "bun-windows-x64" ]]; then
            echo "keeping raw $OUT for icon patching"
          else
            mkdir -p stage
            cp "$OUT" stage/meero
            tar -czf "$OUT.tar.gz" -C stage meero
            rm -f "$OUT"
            ls -lh "$OUT.tar.gz"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: meero-*

  brand-windows:
    name: Brand & package Windows
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install deps
        run: bun install

      - name: Download raw exe
        uses: actions/download-artifact@v4
        with:
          name: bun-windows-x64
          path: .

      - name: Patch icon + metadata (Bun logo -> meero logo)
        run: |
          $env:VER = "${{ github.ref_name }}".Substring(1)
          bun scripts/patch-icon.mjs meero-windows-x64.exe assets/meero.ico $env:VER
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build zip + NSIS setup
        run: |
          $env:VER = "${{ github.ref_name }}".Substring(1)
          New-Item -ItemType Directory stage | Out-Null
          Copy-Item meero-windows-x64.exe stage/meero.exe
          Compress-Archive -Path stage/meero.exe -DestinationPath meero-windows-x64.zip -Force

          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress | Out-Null
            $env:Path += ";C:\Program Files (x86)\NSIS"
          }
          # NSIS resolves relative paths against the script's directory, so
          # everything is passed as absolute.
          & makensis /DVERSION=$env:VER "/DEXE=$PWD\stage\meero.exe" "/DICON=$PWD\assets\meero.ico" "/DOUT=$PWD\meero-setup-windows-x64.exe" scripts\installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item meero-windows-x64.zip, meero-setup-windows-x64.exe | Select-Object Name, Length

      - name: Verify patched metadata
        run: |
          $vi = (Get-Item stage/meero.exe).VersionInfo
          if ($vi.ProductName -ne "meero") { throw "expected ProductName 'meero', got '$($vi.ProductName)'" }
          Write-Host "ProductName=$($vi.ProductName) FileDescription=$($vi.FileDescription) Version=$($vi.FileVersion)"

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            meero-windows-x64.zip
            meero-setup-windows-x64.exe

  installer-linux:
    name: Build .deb packages
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download tarballs
        uses: actions/download-artifact@v4
        with:
          pattern: bun-linux-*
          path: .
          merge-multiple: true

      - name: Build debs
        run: |
          VER="${GITHUB_REF_NAME#v}"
          sudo gem install fpm --no-document
          for arch in x64 arm64; do
            mkdir -p "stage-$arch/usr/bin" "stage-$arch/usr/share/icons/hicolor/512x512/apps"
            tar -xzOf "meero-linux-$arch.tar.gz" meero > "stage-$arch/usr/bin/meero"
            chmod +x "stage-$arch/usr/bin/meero"
            cp assets/meero.png "stage-$arch/usr/share/icons/hicolor/512x512/apps/meero.png"
            case "$arch" in
              x64)   DEB_ARCH=amd64 ;;
              arm64) DEB_ARCH=arm64 ;;
            esac
            fpm -s dir -t deb -n meero -v "$VER" -a "$DEB_ARCH" \
              --license MIT --maintainer "1xcoder" \
              --url "https://github.com/1xcoder-1/meero" \
              --description "Natural language to shell commands CLI" \
              -p "meero-linux-$arch.deb" -C "stage-$arch" usr
          done
          ls -lh meero-linux-*.deb

      - name: Upload debs
        uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: meero-linux-*.deb

  installer-macos:
    name: Build .pkg installers
    needs: build
    runs-on: macos-latest
    steps:
      - name: Download tarballs
        uses: actions/download-artifact@v4
        with:
          pattern: bun-darwin-*
          path: .
          merge-multiple: true

      - name: Build pkgs
        run: |
          VER="${GITHUB_REF_NAME#v}"
          for arch in arm64 x64; do
            mkdir -p "stage-$arch"
            tar -xzOf "meero-macos-$arch.tar.gz" meero > "stage-$arch/meero"
            chmod +x "stage-$arch/meero"
            pkgbuild --root "stage-$arch" --identifier com.1xcoder.meero \
              --version "$VER" --install-location /usr/local/bin \
              "meero-macos-$arch.pkg"
          done
          ls -lh meero-macos-*.pkg

      - name: Upload pkgs
        uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: meero-macos-*.pkg

  publish-npm:
    name: Publish to npm
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm provenance via GitHub OIDC trusted publishing
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install deps
        run: bun install

      - name: Build bundle
        run: bun run build:npm

      - name: Smoke-test the bundle
        run: node -e "const s=require('fs').readFileSync('dist/index.js','utf8'); if(!s.startsWith('#!/usr/bin/env bun')) throw new Error('shebang missing')" && bun dist/index.js --version

      - name: Publish
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
            npm publish
          else
            if ! npm publish --provenance; then
              echo "::error::npm publish failed. Either add an NPM_TOKEN repo secret, or enable npm Trusted Publishing (GitHub repo 1xcoder-1/meero, pattern meero-*.tgz) at www.npmjs.com > Access Tokens > Trusted Publishing."
              exit 1
            fi
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  release:
    name: Create Release
    needs: [build, brand-windows, installer-linux, installer-macos]
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten files
        run: |
          mkdir release
          # The raw (unbranded, uncompressed) Windows exe is only an internal
          # hand-off to brand-windows; the release ships the zip + setup instead.
          find dist -type f ! -name 'meero-windows-x64.exe' -exec mv -f {} release/ \;
          ls -lh release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
