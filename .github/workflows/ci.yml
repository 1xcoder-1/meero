name: CI

# Every push and PR gets the same gates the release tag gets —
# the release workflow alone lets regressions land silently between tags.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  cli:
    name: CLI tests & typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install deps
        run: bun install

      - name: Unit tests
        run: bun test

      - name: Typecheck
        run: bunx tsc --noEmit

  website:
    name: Website lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
